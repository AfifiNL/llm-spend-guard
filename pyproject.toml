[project]
name = "llm-spend-guard"
version = "0.1.0"
description = "A budget guard for LLM calls: reserve the worst-case cost in PostgreSQL before each call, settle the actual cost after it, and refuse calls without a checked price."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Hossam Afifi" }]
dependencies = [
    "fastapi>=0.115",
    "opentelemetry-api>=1.27",
    "opentelemetry-sdk>=1.27",
    "psycopg-pool>=3.2",
    "psycopg[binary]>=3.2",
    "pydantic>=2.7",
    "uvicorn>=0.30",
]

[project.urls]
Repository = "https://github.com/AfifiNL/llm-spend-guard"

[project.scripts]
llm-spend-guard = "spend_guard.cli:main"

[project.optional-dependencies]
gemini = [
    "google-genai>=3.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
    "mypy>=1.13",
    "hypothesis>=6.100",
    "httpx>=0.27",
]
localpg = [
    "pgserver>=0.1.4",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/spend_guard"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "S", "PT"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["spend_guard"]
mypy_path = "src"
